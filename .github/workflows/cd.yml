name: CD - Manual Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git Commit Hash (Image Tag) to deploy'
        required: true
        default: 'latest' # leave as is or set to specific tag

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: spring-petclinic
  ECS_CLUSTER: petclinic-cluster
  ECS_SERVICE: petclinic-service
  CONTAINER_NAME: petclinic-container

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition petclinic-task \
            --query taskDefinition > task-def.json

      - name: Render new image ID into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true