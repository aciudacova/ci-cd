name: CD - Manual Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git Commit Hash (Image Tag) to deploy.'
        required: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: spring-petclinic
  ECS_CLUSTER: petclinic-cluster
  ECS_SERVICE: petclinic-service
  CONTAINER_NAME: petclinic-container

jobs:
  deploy:
    name: Deploy & Update GitOps Repo
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render new image ID into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: config/task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Commit and Merge updated Task Definition to Main
        env:
          NEW_TAG: ${{ github.event.inputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="release-${NEW_TAG:0:7}"
          git checkout -b "$BRANCH_NAME"
          cp ${{ steps.task-def.outputs.task-definition }} config/task-def.json

          git add config/task-def.json
          git commit -m "gitops: update ecs task definition image tag to ${NEW_TAG:0:7} [skip ci]"

          git push origin "$BRANCH_NAME" --force

          gh pr create --title "GitOps: Sync Task Definition to ${NEW_TAG:0:7}" --body "Automated PR to sync infrastructure state after successful ECS deployment." --base main --head "$BRANCH_NAME"
          gh pr merge --merge --delete-branch