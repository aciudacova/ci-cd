name: CI/CD Pipeline - Spring Petclinic

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'           # Все исходники, тесты, HTML-шаблоны и ресурсы
      - 'pom.xml'          # Конфигурация зависимостей Maven
      - 'Dockerfile'       # Изменения в сборке контейнера
      - 'mvnw'             # Изменения Maven Wrapper
      - '.mvn/**'          
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'mvnw'
      - '.mvn/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: spring-petclinic
  ECS_CLUSTER: petclinic-cluster
  ECS_SERVICE: petclinic-service
# подумать о разделении билда и теста
# можно делать инициализацию переменных в зависимости если это снапшот или релиз, в зависимости такде от технологии 
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # download (or "check out") your GitHub repository's code onto the virtual machine (runner) running your workflow 

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # sets up a Java Development Kit (JDK) in GitHub Actions workflow environment (install Java 17, setup PATH)
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # turn on caching for the ~/.m2 directory, which is where Maven stores downloaded dependencies and built artifacts

    - name: Run Unit Tests with Maven
      run: ./mvnw clean test # is used in Maven projects to ensure you are running your unit tests against a fresh, recompiled version of your code

 #  пусть отдельно фэйлисься скан и отдельно пуш
  security-scan-and-push:
    name: Docker Build, Scan & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # runs only on push events, not on pull requests, to avoid pushing images for unmerged code
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
        format: 'table'
        exit-code: '0' # fail pipeline if vulnerabilities are found / 0 - do not fail
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

# деплой отвязать от билда
  deploy:
    name: Deploy to ECS
    needs: security-scan-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

# предусмотреть место для обновления тега, если не хотим форсить деплой при каждом пуше в main
    - name: Force new ECS deployment
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --force-new-deployment